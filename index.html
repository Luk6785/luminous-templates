<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luminous Templates — Premium HTML website templates</title>
  <meta name="description" content="Premium HTML website templates. Secure checkout & instant download via Gumroad." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Script overlay Gumroad: bấm "Mua" sẽ mở checkout ngay trên trang -->
  <script src="https://gumroad.com/js/gumroad.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">
        <span class="logo-mark">◍</span>
        <span class="logo-text" id="storeName">Luminous</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="header-right">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="vi">VI</button>
        </div>
        <a class="btn btn-ghost header-cta" id="profileLink" target="_blank" rel="noopener" data-i18n="headerCta">Gumroad page ↗</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <p class="hero-eyebrow" data-i18n="heroEyebrow">Premium HTML website templates</p>
      <h1 class="hero-title" data-i18n-html="heroTitle"></h1>
      <p class="hero-sub" data-i18n="heroSub"></p>
      <div class="hero-actions">
        <a href="#products" class="btn btn-primary" data-i18n="heroCta1">Browse templates</a>
        <a href="#" class="btn btn-ghost" id="heroProfile" target="_blank" rel="noopener" data-i18n="heroCta2">See all on Gumroad</a>
      </div>
      <div class="hero-trust">
        <span data-i18n="trust1"></span>
        <span data-i18n="trust2"></span>
        <span data-i18n="trust3"></span>
      </div>
    </div>
  </section>

  <main class="container" id="products">
    <div class="section-head">
      <h2 data-i18n="sectionTitle">All products</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <strong id="footerName">Luminous</strong>
      <p class="muted" data-i18n="footerNote"></p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
